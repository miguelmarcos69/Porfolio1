@if (project(); as project) {
  <main class="section project-detail">
    <a routerLink="/proyectos" class="back-link">← Volver a proyectos</a>

    <div class="project-head">
      <h1>{{ project.name }}</h1>
      <span class="project-tag">{{ project.tag }}</span>
    </div>

    <p class="desc">{{ project.longDescription }}</p>

    @if (project.demo; as demo) {
      <h2>Pruébala</h2>
      <div class="demo-block">
        <app-device-demo [demo]="demo" [name]="project.name" />
      </div>
    }

    <h2>Stack tecnológico</h2>
    <ul class="stack-list">
      @for (item of project.stack; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  </main>
}
